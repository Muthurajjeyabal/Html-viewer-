<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HTML Viewer</title>
<meta name="description" content="Open and view local HTML files on your device">
<meta name="theme-color" content="#1565C0">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  :root {
    --primary: #1565C0;
    --primary-dark: #0D47A1;
    --bg: #F5F7FA;
    --text: #333;
    --muted: #777;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 10;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { background: rgba(255,255,255,0.3); }

  main { flex: 1; position: relative; overflow: hidden; }

  #emptyState {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  #emptyState .icon-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #E3EEFC;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 36px;
  }
  #emptyState p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 0 24px;
  }
  .primary-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 13px 28px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(21,101,192,0.3);
  }
  .primary-btn:active { background: var(--primary-dark); }

  #viewerFrame {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
    display: none;
  }

  #fileName {
    font-size: 12px;
    opacity: 0.85;
    display: block;
    font-weight: 400;
  }

  #fabOpen {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
  }
  #fabOpen:active { background: var(--primary-dark); }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
    max-width: 85%;
    text-align: center;
  }
  #toast.show { opacity: 1; }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div>
      <h1 id="headerTitle">HTML Viewer</h1>
      <span id="fileName"></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnReload" title="Reload" style="display:none;">&#8635;</button>
      <button class="icon-btn" id="btnOpenTop" title="Open">&#128193;</button>
    </div>
  </header>

  <main>
    <div id="emptyState">
      <div class="icon-circle">&#128196;</div>
      <p>உங்க போன்ல இருக்குற ஒரு HTML file-ஐ தேர்ந்தெடுத்து இங்க பார்க்கலாம்.</p>
      <button class="primary-btn" id="btnOpenMain">HTML File தேர்ந்தெடு</button>
    </div>

    <iframe id="viewerFrame" title="HTML content" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

    <button id="fabOpen" title="Open another file">+</button>
  </main>
</div>

<input type="file" id="fileInput" accept=".html,.htm,text/html">

<div id="toast"></div>

<script>
  const fileInput = document.getElementById('fileInput');
  const viewerFrame = document.getElementById('viewerFrame');
  const emptyState = document.getElementById('emptyState');
  const fabOpen = document.getElementById('fabOpen');
  const btnReload = document.getElementById('btnReload');
  const fileNameEl = document.getElementById('fileName');
  const toast = document.getElementById('toast');

  let lastFile = null;

  function openPicker() {
    fileInput.value = '';
    fileInput.click();
  }

  document.getElementById('btnOpenMain').addEventListener('click', openPicker);
  document.getElementById('btnOpenTop').addEventListener('click', openPicker);
  fabOpen.addEventListener('click', openPicker);

  btnReload.addEventListener('click', () => {
    if (lastFile) renderFile(lastFile);
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    lastFile = file;
    renderFile(file);
  });

  function renderFile(file) {
    const reader = new FileReader();
    reader.onload = function (evt) {
      try {
        viewerFrame.srcdoc = evt.target.result;
        viewerFrame.style.display = 'block';
        emptyState.style.display = 'none';
        fabOpen.style.display = 'flex';
        btnReload.style.display = 'flex';
        fileNameEl.textContent = file.name;
      } catch (err) {
        showToast('இந்த file-ஐ HTML ஆக திறக்க முடியல');
      }
    };
    reader.onerror = function () {
      showToast('File படிக்க முடியல');
    };
    reader.readAsText(file);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // Register service worker for offline / installable behavior (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
